[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pid-prover"
version = "0.1.0"
description = "Automated theorem proving for Partial Information Decomposition using Z3"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Pedro Mediano", email = "pedro.mediano@imperial.ac.uk"}
]
maintainers = [
    {name = "Pedro Mediano", email = "pedro.mediano@imperial.ac.uk"}
]
keywords = [
    "information-theory",
    "partial-information-decomposition",
    "theorem-proving",
    "z3",
    "automated-reasoning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.10"
dependencies = [
    "z3-solver>=4.8.0",
    "pandas>=1.5.0",
    "pytest>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "ipython>=8.0.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    "networkx>=3.0",
    "graphviz>=0.20",
]

[project.scripts]
pid-prover = "pid_prover.cli:main"

[project.urls]
Homepage = "https://github.com/pmediano/pid-prover"
Documentation = "https://github.com/pmediano/pid-prover/blob/main/README.md"
Repository = "https://github.com/pmediano/pid-prover"
"Bug Tracker" = "https://github.com/pmediano/pid-prover/issues"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["pid_prover"]

[tool.setuptools.package-data]
pid_prover = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "exploration*.py"]
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --strict-markers"
markers = [
    "integration: marks tests that test multiple components together",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/pid_prover"]
omit = ["*/tests/*", "*/test_*.py", "*/demo/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
