[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pid-prover"
version = "0.2.0"
description = "Automated reasoning on the properties of Partial Information Decomposition measures with Z3"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Pedro Mediano", email = "pedro.mediano@imperial.ac.uk"},
    {name = "Alberto Liardi", email = "a.liardi@imperial.ac.uk"}
]
maintainers = [
    {name = "Pedro Mediano", email = "pedro.mediano@imperial.ac.uk"},
    {name = "Alberto Liardi", email = "a.liardi@imperial.ac.uk"}
]
keywords = [
    "information-theory",
    "partial-information-decomposition",
    "theorem-proving",
    "z3",
    "automated-reasoning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.10"
dependencies = [
    "z3-solver>=4.8.0",
    "pandas>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "matplotlib>=3.5.0",
]

[project.scripts]
pid-prover = "pid_prover.cli:main"

[project.urls]
Homepage = "https://github.com/Imperial-MIND-lab/pid-prover"
Documentation = "https://github.com/Imperial-MIND-lab/pid-prover/tree/master/docs"
Repository = "https://github.com/Imperial-MIND-lab/pid-prover"
"Bug Tracker" = "https://github.com/Imperial-MIND-lab/pid-prover/issues"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["pid_prover"]

[tool.setuptools.package-data]
pid_prover = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short --strict-markers"
